<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IFES+Alegre — Contatos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14703F}a:hover{color:#0D4F2C}
a:focus-visible{outline:3px solid #4A56A6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100%; background: #FAFFFF; color: #1F2A24; font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.5">

  <dc-import name="Cabecalho" active="contatos" hint-size="1280,80"></dc-import>

  <section style="position: relative; overflow: hidden; background: #5F6DB5; color: #FFFFFF">
    <svg width="110" height="110" viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; right: 4%; top: 14px"><polygon points="50,0 61,30 90,15 70,40 100,50 70,60 90,85 61,70 50,100 39,70 10,85 30,60 0,50 30,40 10,15 39,30" fill="#DDA3F0"></polygon></svg>
    <svg width="130" height="90" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; right: 16%; bottom: 0"><polygon points="0,100 50,0 100,100" fill="#F59E0B"></polygon></svg>
    <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 44px 24px 48px">
      <h1 style="margin: 0 0 10px; font-size: 38px; line-height: 1.15; font-weight: 700">Contatos</h1>
      <p style="margin: 0; max-width: 640px; color: #FFFFFF">Alunos e professores encontram aqui os meios de contato de forma rápida e prática, para tirar dúvidas, trocar informações e fortalecer a conexão entre todos do IFES · Campus de Alegre.</p>
    </div>
  </section>

  <main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 56px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="12">
        <article style="flex: 1 1 260px; max-width: 380px; background: #FFFFFF; border: 1px solid #E3ECE7; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 14px">
          <span style="{{p.avatar}}">{{p.initials}}</span>
          <div style="min-width: 0">
            <p style="margin: 0; font-weight: 600">{{p.name}}</p>
            <a href="{{p.href}}" style="font-size: 14px; overflow-wrap: anywhere">{{p.email}}</a>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

  <dc-import name="Rodape" hint-size="1280,340"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Kênia Rangel', 'kenia'], ['Luiz Guilherme', 'luizg'], ['Flávia Pirovani', 'flavia'],
      ['Luiz Coêlho', 'luizc'], ['Rosana Dias', 'rosana'], ['Flávio Pavesi', 'flavio'],
      ['Bruno Palhares', 'bruno'], ['André Oliveira', 'andre'], ['Danilo Alves', 'danilo'],
      ['Vanair Curty', 'vanair'], ['Jacyara Mardgan', 'jacyara'], ['Cayo Magno', 'cayo']
    ];
    const tones = ['#E6E9F8', '#FDE9C8', '#DDF1E5', '#EBDDF3'];
    return {
      people: list.map((x, i) => {
        const email = x[1] + '@ifes.com';
        const parts = x[0].split(' ');
        return {
          name: x[0],
          email: email,
          href: 'mailto:' + email,
          initials: parts[0].charAt(0) + parts[parts.length - 1].charAt(0),
          avatar: 'flex:0 0 44px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-size:14px;font-weight:600;color:#1F2A24;background:' + tones[i % 4]
        };
      })
    };
  }
}
</script>
</body>
</html>
