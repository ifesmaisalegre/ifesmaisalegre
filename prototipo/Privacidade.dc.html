<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IFES+Alegre — Política de privacidade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14703F}a:hover{color:#0D4F2C}
a:focus-visible{outline:3px solid #4A56A6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100%; background: #FAFFFF; color: #1F2A24; font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.6">
  <dc-import name="Cabecalho" active="" hint-size="1280,80"></dc-import>

  <section style="background: #14703F; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 44px 24px 48px">
      <h1 style="margin: 0 0 10px; font-size: 38px; line-height: 1.15; font-weight: 700">Política de privacidade</h1>
      <p style="margin: 0; max-width: 620px; color: #E3F4EA">Como tratamos os dados e as fotos enviados ao site.</p>
    </div>
  </section>

  <main style="max-width: 820px; margin: 0 auto; padding: 36px 24px 56px">
    <p role="note" style="margin: 0 0 28px; padding: 12px 16px; border-radius: 10px; background: #FDE9C8; color: #5B3A00; font-size: 14px">Texto modelo. Deve ser revisado pela coordenação do campus antes da publicação oficial.</p>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
      <section style="margin-bottom: 26px">
        <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #0F6B43">{{s.title}}</h2>
        <p style="margin: 0; color: #3C4741">{{s.text}}</p>
      </section>
    </sc-for>
  </main>

  <dc-import name="Rodape" hint-size="1280,340"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: 'Quais dados coletamos', text: 'Na inscrição em uma atividade pedimos nome, matrícula, e-mail e telefone. No envio de fotos para a galeria, recebemos a imagem enviada.' },
        { title: 'Para que usamos', text: 'Os dados de inscrição servem apenas para que o docente responsável organize a atividade e entre em contato. As fotos são publicadas na galeria somente depois da avaliação dos docentes.' },
        { title: 'Fotos e autorização', text: 'Ao enviar uma foto, você autoriza a sua publicação no site. Se aparecerem menores de 18 anos, é necessária a autorização do responsável. Você pode pedir a remoção de uma foto a qualquer momento.' },
        { title: 'Compartilhamento', text: 'Os dados não são vendidos nem compartilhados com terceiros, exceto quando exigido por lei.' },
        { title: 'Seus direitos', text: 'Você pode pedir acesso, correção ou exclusão dos seus dados pelo telefone (27) 3083-4310 ou procurando a coordenação do campus.' }
      ]
    };
  }
}
</script>
</body>
</html>
